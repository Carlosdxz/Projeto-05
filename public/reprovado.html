<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado - Reprovado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            border: 2px solid #c62828;
            border-radius: 8px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #c62828;
            margin-top: 0;
        }
        .info {
            text-align: left;
            margin: 20px 0;
            line-height: 1.8;
            font-size: 16px;
        }
        .status {
            font-size: 20px;
            font-weight: bold;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Atenção</h1>
        <div class="info">
            <p><strong>Nota P1:</strong> {{P1}}</p>
            <p><strong>Nota P2:</strong> {{P2}}</p>
            <p><strong>Média Final:</strong> {{MEDIA}}</p>
            <p><strong>Situação:</strong> <span class="status">{{SITUACAO}}</span></p>
        </div>
    </div>
</body>
</html>
